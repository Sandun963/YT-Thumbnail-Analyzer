<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Thumbnail Research Analyzer</title><link rel="stylesheet" href="/static/styles.css"></head><body><main class="shell"><header><h1>Thumbnail Benchmark Analyzer</h1></header><section class="panel"><label class="field-label" for="thumbnailInput">Upload thumbnail (JPG, PNG or WebP, up to 10 MB)</label><input id="thumbnailInput" type="file" accept="image/jpeg,image/png,image/webp"><div class="preview-wrap"><img id="preview" alt="Selected thumbnail preview" hidden></div><button id="analyzeButton" type="button">Analyze thumbnail</button><span id="loading" role="status" aria-live="polite"></span><p id="error" class="error" role="alert" hidden></p></section><section id="result" class="panel" hidden><div class="section-head"><div><h2>Benchmark comparison</h2><p id="summary"></p></div><button id="downloadButton" type="button" class="secondary">Download JSON report</button></div><div id="metrics" class="metrics"></div><h2>Review suggestions</h2><div id="suggestions"></div><p class="footnote" id="researchNote"></p></section></main><script src="/static/scripts.js"></script></body></html>
